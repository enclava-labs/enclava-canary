[app]
name = "e2e-drill"
port = 8080
command = ["python3", "/app/server.py"]

[storage]
paths = ["/app/data"]
# S1792 small-workload declaration: 2Gi app-data + 1Gi TLS PVCs.
size = "2Gi"
tls_size = "1Gi"

[unlock]
mode = "password"

# The canary serves + reads the in-pod sidecar (localhost) — it needs no external
# egress. Sigstore hosts listed only to mirror a known-good config; unused at runtime.
[egress]
allow = [
  { host = "kdsintf.amd.com", ports = [443] },
  { host = "ghcr.io", ports = [443] },
  { host = "rekor.sigstore.dev", ports = [443] },
  { host = "fulcio.sigstore.dev", ports = [443] },
  { host = "tuf-repo-cdn.sigstore.dev", ports = [443] },
]

[resources]
# S1792 small shape: limit below 512Mi selects kata-qemu-snp-small rendering
# (app request lowered to the limit, 64Mi sidecars, 1024Mi VM baseline).
cpu = "1"
memory = "128Mi"

[health]
path = "/health"
interval = 30
timeout = 5
